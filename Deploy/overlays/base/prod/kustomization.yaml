apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: python-app-prod

bases:
  - ../../base

namePrefix: prod-

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: your-dockerhub-username/your-image-name:v1.0.0  # ← prod image tag
    target:
      kind: Deployment
      name: python-app

commonLabels:
  environment: prod